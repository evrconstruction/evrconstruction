# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure-cloud-run
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
  - variable: FIREBASE_ADMIN_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_ADMIN_SERVICE_ACCOUNT_KEY
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LfA8aUtAAAAAK9RJDiKsWe1qg9t-ZuqsP4tjdMz
